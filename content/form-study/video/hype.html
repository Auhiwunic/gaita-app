<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#000; }
  #stage { width:1080px; height:1920px; position:relative;
    background: radial-gradient(125% 70% at 50% 12%, #1b2228 0%, #121518 60%);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; color:#fff; }
  .abs { position:absolute; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,monospace; }
  .c { position:absolute; left:0; right:0; text-align:center; }
  .wm { font-weight:800; letter-spacing:2px; }
  .wm .d { color:#FF2D2D; }
  .kick { font-weight:700; letter-spacing:8px; color:#00CED1; }
  .head { font-weight:850; letter-spacing:-2px; line-height:0.98; }
  .head .r { color:#FF2D2D; }
  .head .cy { color:#00CED1; }
  .sub { color:rgba(255,255,255,0.55); font-weight:500; }
  #ring0 { border-radius:50%; background:conic-gradient(#FF2D2D,#E89830,#00C46A,#00CED1,#FF2D2D); }
  #ring0::after { content:""; position:absolute; inset:22%; border-radius:50%; background:#121518; }
  .chip { display:inline-block; background:#252B31; border-radius:16px; padding:14px 26px;
    font-weight:700; font-size:30px; margin:0 8px; }
  .chip .k { color:rgba(255,255,255,0.45); font-size:22px; margin-right:8px; }
  .focus { display:inline-block; background:rgba(0,206,209,0.12); border:2px solid #00CED1;
    color:#00CED1; border-radius:22px; padding:22px 44px; font-weight:800; font-size:44px; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stage">
  <!-- Skeleton (SVG) sits center; revealed in scene 3 -->
  <svg id="skel" class="abs" style="left:290px; top:560px" width="500" height="760" viewBox="0 0 500 760">
    <g id="skelG" fill="none" stroke="#FF2D2D" stroke-width="10" stroke-linecap="round">
      <circle id="j_head" cx="250" cy="70" r="42" fill="#FF2D2D" stroke="none"/>
      <line id="b_spine" x1="250" y1="112" x2="250" y2="360"/>
      <!-- arm -->
      <line id="b_uarm" x1="250" y1="170" x2="180" y2="260"/>
      <line id="b_farm" x1="180" y1="260" x2="245" y2="315"/>
      <!-- front leg (driving knee up) -->
      <line id="b_fthigh" x1="250" y1="360" x2="345" y2="470"/>
      <line id="b_fshin"  x1="345" y1="470" x2="315" y2="600"/>
      <line id="b_ffoot"  x1="315" y1="600" x2="380" y2="620"/>
      <!-- back leg (push off) -->
      <line id="b_bthigh" x1="250" y1="360" x2="175" y2="490"/>
      <line id="b_bshin"  x1="175" y1="490" x2="120" y2="620"/>
      <line id="b_bfoot"  x1="120" y1="620" x2="70"  y2="640"/>
      <g fill="#fff" stroke="none">
        <circle class="jt" cx="250" cy="170" r="12"/><circle class="jt" cx="180" cy="260" r="12"/>
        <circle class="jt" cx="250" cy="360" r="14"/><circle class="jt" cx="345" cy="470" r="12"/>
        <circle class="jt" cx="315" cy="600" r="12"/><circle class="jt" cx="175" cy="490" r="12"/>
        <circle class="jt" cx="120" cy="620" r="12"/>
      </g>
    </g>
    <line id="scanline" x1="0" y1="0" x2="500" y2="0" stroke="#00CED1" stroke-width="4" opacity="0"/>
  </svg>

  <!-- Form score ring (scene 3) -->
  <svg id="scoreRing" class="abs" style="left:120px; top:640px" width="300" height="300" viewBox="0 0 300 300">
    <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="20"/>
    <circle id="scoreArc" cx="150" cy="150" r="130" fill="none" stroke="#00CED1" stroke-width="20"
      stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="817" stroke-dashoffset="817"/>
  </svg>
  <div id="scoreNum" class="abs mono" style="left:120px; top:700px; width:300px; text-align:center; font-weight:850; font-size:150px"></div>
  <div id="scoreLbl" class="abs" style="left:120px; top:880px; width:300px; text-align:center; font-weight:700; font-size:34px; color:rgba(255,255,255,0.5); letter-spacing:2px">FORM</div>

  <!-- Text layers -->
  <div id="ringWrap" class="abs" style="left:440px; top:300px"><div id="ring0" style="width:200px;height:200px"></div></div>
  <div id="wmBig" class="c mono wm" style="top:530px; font-size:96px">GAITA<span class="d">.</span></div>
  <div id="tagline" class="c kick" style="top:660px; font-size:36px">RUNNING FORM, READ BY YOUR PHONE</div>

  <div id="h1" class="c head" style="top:760px; font-size:120px"></div>
  <div id="h1sub" class="c sub" style="top:940px; font-size:40px"></div>

  <div id="chips" class="c" style="top:1020px"></div>
  <div id="focusWrap" class="c" style="top:1080px"></div>

  <!-- Outro -->
  <div id="outWm" class="c mono wm" style="top:820px; font-size:110px; opacity:0">GAITA<span class="d">.</span></div>
  <div id="outTag" class="c sub" style="top:970px; font-size:44px; opacity:0">Your pocket running coach</div>
  <div id="outCta" class="c kick" style="top:1050px; font-size:34px; opacity:0">COMING SOON</div>
</div>

<script>
const P=new URLSearchParams(location.search);
const total=+(P.get('total')||390), fps=+(P.get('fps')||30);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x,0,1),3);
const eio=x=>{x=clamp(x,0,1);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const $=id=>document.getElementById(id);
const set=(el,o)=>{for(const k in o)el.style[k]=o[k];};
// fade envelope: 0 before in, ramps over inDur, holds, ramps out over outDur before end
const env=(t,tin,inD,tout,outD)=>clamp(eo((t-tin)/inD),0,1)*(tout?(1-eio((t-tout)/outD)):1);

window.renderFrame=function(f){
const t=f/fps;
const ids=['ringWrap','wmBig','tagline','h1','h1sub','chips','focusWrap','skel','scoreRing','scoreNum','scoreLbl','outWm','outTag','outCta'];
ids.forEach(id=>$(id).style.opacity=0);
$('scanline').setAttribute('opacity',0);

// ---- Scene 1: brand (0.0 - 2.4) ----
if(t<2.6){
  const a=env(t,0.1,0.7,2.0,0.5);
  const up=-40*eio((t-1.9)/0.5);
  set($('ringWrap'),{opacity:a, transform:`translateY(${up}px) scale(${0.7+0.3*eo(t/0.6)}) rotate(${18*eo(t/1.2)}deg)`});
  set($('wmBig'),{opacity:a, transform:`translateY(${up}px)`});
  set($('tagline'),{opacity:env(t,0.7,0.7,2.0,0.5), transform:`translateY(${up}px)`});
}

// ---- Scene 2: "Film one run." (2.4 - 4.8) ----
if(t>=2.3 && t<4.9){
  const lt=t-2.4, a=env(t,2.4,0.5,4.4,0.4);
  $('h1').innerHTML='Film one <span class="r">run.</span>';
  set($('h1'),{opacity:a, top:'720px', fontSize:'130px', transform:`translateY(${24*(1-eo(lt/0.5))}px)`});
  $('h1sub').textContent='Side on. A few seconds. That is it.';
  set($('h1sub'),{opacity:env(t,2.8,0.5,4.4,0.4), top:'900px'});
}

// ---- Scene 3: skeleton + analysis (4.8 - 8.4) ----
if(t>=4.7 && t<8.6){
  const lt=t-4.9, a=env(t,4.9,0.5,8.1,0.4);
  // skeleton reveal, limb by limb, with a scan sweep
  const limbs=['j_head','b_spine','b_uarm','b_farm','b_fthigh','b_fshin','b_ffoot','b_bthigh','b_bshin','b_bfoot'];
  set($('skel'),{opacity:a});
  limbs.forEach((id,i)=>{ $(id).style.opacity = clamp(eo((lt-0.15*i)/0.4),0,1); });
  document.querySelectorAll('.jt').forEach(el=>el.style.opacity=clamp(eo((lt-1.2)/0.5),0,1));
  const sy=760*clamp(lt/1.6,0,1);
  $('scanline').setAttribute('y1',sy); $('scanline').setAttribute('y2',sy);
  $('scanline').setAttribute('opacity', lt<1.7?0.9*a:0);
  // form ring + number count (starts ~1.4s in)
  const rp=eo((lt-1.4)/1.2);
  set($('scoreRing'),{opacity:a*clamp(rp*3,0,1)});
  $('scoreArc').setAttribute('stroke-dashoffset', 817*(1-0.71*rp));   // 71%
  set($('scoreNum'),{opacity:a*clamp(rp*3,0,1)}); $('scoreNum').textContent=Math.round(71*rp);
  set($('scoreLbl'),{opacity:a*clamp(rp*3,0,1)});
  $('h1').innerHTML='Analyzed on your <span class="cy">phone.</span>';
  set($('h1'),{opacity:env(t,5.0,0.5,8.1,0.4), top:'320px', fontSize:'96px', transform:'none'});
  $('chips').innerHTML='<span class="chip"><span class="k">CAD</span>172</span><span class="chip"><span class="k">STRIKE</span>MID</span><span class="chip"><span class="k">GCT</span>238</span>';
  set($('chips'),{opacity:env(t,6.2,0.6,8.1,0.4), top:'1080px', fontSize:'0'});
}

// ---- Scene 4: the fix (8.4 - 10.9) ----
if(t>=8.3 && t<11.0){
  const lt=t-8.5, a=env(t,8.5,0.5,10.5,0.4);
  $('h1').innerHTML='Then fix the <span class="cy">one thing</span><br>that matters.';
  set($('h1'),{opacity:a, top:'560px', fontSize:'96px', transform:`translateY(${20*(1-eo(lt/0.5))}px)`});
  $('focusWrap').innerHTML='<span class="focus mono">LIFT CADENCE &nbsp;+8%</span>';
  set($('focusWrap'),{opacity:env(t,9.1,0.5,10.5,0.4), top:'920px', transform:`scale(${0.8+0.2*eo((lt-0.6)/0.5)})`});
}

// ---- Scene 5: outro (11.0 - 13.0) ----
if(t>=10.9){
  const lt=t-11.0;
  set($('outWm'),{opacity:eo(lt/0.6), transform:`scale(${0.9+0.1*eo(lt/0.6)})`});
  set($('outTag'),{opacity:eo((lt-0.4)/0.6)});
  set($('outCta'),{opacity:eo((lt-0.9)/0.6)});
}
document.body.setAttribute('data-ready','1');
};
window.renderFrame(0);
</script>
</body>
</html>
