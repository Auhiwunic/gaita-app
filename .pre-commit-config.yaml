# Secret-leak prevention for Corsa.
# Activates once this folder is under git:  pip install pre-commit && pre-commit install
# Scans every commit (and the staged diff) for hardcoded API keys / tokens so an
# OpenAI key, Firebase secret, etc. can never be committed again.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
